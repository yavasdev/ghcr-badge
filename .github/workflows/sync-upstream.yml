name: Sync Upstream

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * *'
  
  # Allows you to manually trigger the sync from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the synced commits to your fork

    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Syncs the 'master' branch of your fork with the upstream repository
          gh repo sync ${{ github.repository }} --branch master
